services:
  - type: web
    name: kitchenlab
    env: node
    buildCommand: npm install && cd client && npx vite build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
